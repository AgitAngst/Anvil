[package]
name = "anvil-update"
description = "Проверка и установка обновлений изнутри программы: GitHub Releases, SHA-256, перезапуск"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["ui"]
# Готовый баннер и окно «Что нового» на anvil-ui.
ui = ["dep:anvil-ui", "dep:eframe"]

[dependencies]
anvil-ui = { path = "../anvil-ui", optional = true }
eframe = { workspace = true, optional = true }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "blocking"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.11.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
