[package]
name = "anvil-ui"
description = "Единый вид для всех программ: темы, значки, виджеты"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Сериализация общих настроек (тема, язык, обновления) — программа хранит их у себя.
serde = ["dep:serde"]

[dependencies]
anvil-wallpaper = { path = "../anvil-wallpaper" }
eframe = { workspace = true }
serde = { version = "1", features = ["derive"], optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Globalization", "Win32_UI_WindowsAndMessaging"] }
# HWND окна для `taskbar` (большой значок на панели задач); та же версия, что у eframe.
raw-window-handle = "0.6.2"
