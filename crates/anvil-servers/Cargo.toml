[package]
name = "anvil-servers"
description = "Ядро управления серверами: манифест модуля, реестр, SSH, секреты, выпуски GitHub (без графики)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
anyhow = { workspace = true }
reqwest = { workspace = true }
russh = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }

[target.'cfg(windows)'.dependencies]
# Пароли, ключевые фразы и токены — в хранилище учётных данных Windows. Как и в `anvil`, только там: на Linux
# keyring тянет zbus, чьи возможности расходятся с тем, что уже подключает eframe.
keyring = { workspace = true }

[dev-dependencies]
futures = { workspace = true }
tokio = { version = "1.49.0", features = ["full"] }
