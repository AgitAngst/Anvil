[package]
name = "anvil"
description = "Командный центр Rust-программ"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
anvil-ui = { path = "../anvil-ui", features = ["serde"] }
eframe = { workspace = true }
keyring = "4.2.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "blocking"] }
rfd = "0.17.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9.5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
] }

[build-dependencies]
anvil-ui = { path = "../anvil-ui" }
image = { version = "0.25.10", default-features = false, features = ["png", "ico"] }
winresource = "0.1.31"
