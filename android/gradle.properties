# Версия набора Anvil для Android — своя, третья в репозитории; тег android-kit-vX.Y.Z (только по команде).
kitVersion=0.2.0

# Память ПК: больше 2 ГБ Gradle не берёт; запускать с --max-workers=2, после работы ./gradlew --stop.
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
kotlin.code.style=official
android.useAndroidX=true
