[workspace]
resolver = "3"
members = ["crates/anvil-ui", "crates/anvil-update", "crates/anvil", "crates/anvil-wallpaper", "crates/anvil-d3d", "crates/anvil-servers"]

[workspace.package]
# Версия набора (anvil-ui, anvil-update, anvil-wallpaper, anvil-d3d) — она же тег `kit-vX.Y.Z`.
# У приложения версия своя: `crates/anvil/Cargo.toml`, тег `vX.Y.Z`.
version = "1.0.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/AgitAngst/Anvil"
publish = false

[workspace.dependencies]
eframe = "0.36.2"
# Те же версии, что тянет eframe: для окна без eframe (anvil-d3d).
egui = "0.36.2"
egui-winit = "0.36.2"
winit = "0.30.13"

# Зависимости `anvil-servers`: те же версии, что у закрытой админки (согласовано с владельцем 29.10.2026).
russh = "0.63.3"
keyring = "4.2.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "json"] }
sha2 = "0.11.0"
toml = "0.9.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
anyhow = "1.0.104"
thiserror = "2.0.18"
tokio = { version = "1.49.0", features = ["rt", "macros", "io-util", "time", "sync"] }
tracing = "0.1.44"
futures = "0.3.34"
