# Многоразовый выпуск программы семьи Anvil по соглашению docs/RELEASES.md:
# сборка под Windows, архив <app>-X.Y.Z-windows-x64.zip, SHA256SUMS, GitHub Release.
name: Rust release (reusable)

on:
  workflow_call:
    inputs:
      app:
        description: Начало имени архива — <app>-X.Y.Z-windows-x64.zip; пусто — по архиву на каждый бинарник
        required: false
        type: string
        default: ""
      bins:
        description: Бинарники через пробел, которые лягут в архив
        required: true
        type: string
      package:
        description: Пакет cargo (-p), если бинарники не в корневом пакете
        required: false
        type: string
        default: ""
      repository:
        description: Куда публиковать (owner/name); пусто — этот же репозиторий
        required: false
        type: string
        default: ""
    secrets:
      RELEASES_TOKEN:
        description: Токен с правом записи в репозиторий выпусков (для закрытого кода)
        required: false
      SIGN_PFX:
        description: Сертификат подписи кода — файл .pfx в base64. Нет — exe выходят без подписи
        required: false
      SIGN_PASSWORD:
        description: Пароль к SIGN_PFX
        required: false

jobs:
  windows:
    name: Выпуск ${{ inputs.app || inputs.bins }}
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Версия из тега
        id: version
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          if (-not ($tag -match '^v(\d+\.\d+\.\d+)(-[0-9A-Za-z.-]+)?$')) { throw "Тег '$tag' — не vX.Y.Z" }
          $version = $tag.Substring(1)
          "version=$version" >> $env:GITHUB_OUTPUT
          "prerelease=$(if ($Matches[2]) { 'true' } else { 'false' })" >> $env:GITHUB_OUTPUT

      - name: Сборка
        shell: pwsh
        run: |
          $cargo = @('build', '--release', '--locked')
          if ('${{ inputs.package }}') { $cargo += @('-p', '${{ inputs.package }}') }
          foreach ($bin in '${{ inputs.bins }}'.Split(' ', [StringSplitOptions]::RemoveEmptyEntries)) { $cargo += @('--bin', $bin) }
          cargo @cargo
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      # Сертификат виден только шагу подписи — не сборке: иначе его прочёл бы любой
      # build-скрипт зависимости. Секреты в `if` напрямую не видны, поэтому сначала
      # отдельный шаг говорит, передали ли сертификат.
      - name: Есть ли сертификат подписи
        id: signing
        shell: pwsh
        env:
          SIGN_PFX: ${{ secrets.SIGN_PFX }}
        run: |
          "present=$(if ($env:SIGN_PFX) { 'yes' } else { 'no' })" >> $env:GITHUB_OUTPUT

      - name: Подпись
        if: ${{ steps.signing.outputs.present == 'yes' }}
        shell: pwsh
        env:
          SIGN_PFX: ${{ secrets.SIGN_PFX }}
          SIGN_PASSWORD: ${{ secrets.SIGN_PASSWORD }}
        run: |
          # signtool из Windows SDK, который стоит на windows-latest; метка времени — чтобы
          # подпись оставалась действительной и после того, как сертификат истечёт.
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw 'signtool не найден' }
          $pfx = Join-Path $env:RUNNER_TEMP 'sign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGN_PFX))
          try {
            foreach ($bin in '${{ inputs.bins }}'.Split(' ', [StringSplitOptions]::RemoveEmptyEntries)) {
              & $signtool.FullName sign /fd SHA256 /f $pfx /p $env:SIGN_PASSWORD /tr http://timestamp.digicert.com /td SHA256 "target/release/$bin.exe"
              if ($LASTEXITCODE) { exit $LASTEXITCODE }
              & $signtool.FullName verify /pa "target/release/$bin.exe"
              if ($LASTEXITCODE) { exit $LASTEXITCODE }
            }
          } finally {
            Remove-Item $pfx -Force -ErrorAction SilentlyContinue
          }

      - name: Архивы и SHA256SUMS
        shell: pwsh
        run: |
          # Один архив <app>-… со всеми бинарниками, а без app — по архиву <бинарник>-… на каждый
          # (у Amber клиент и командный центр обновляются по отдельности). Суммы — в одном файле.
          $version = '${{ steps.version.outputs.version }}'
          $bins = '${{ inputs.bins }}'.Split(' ', [StringSplitOptions]::RemoveEmptyEntries)
          $groups = if ('${{ inputs.app }}') { @{ '${{ inputs.app }}' = $bins } } else { $g = [ordered]@{}; foreach ($b in $bins) { $g[$b] = @($b) }; $g }
          New-Item -ItemType Directory -Force dist | Out-Null
          $sums = ''
          foreach ($name in $groups.Keys) {
            $stage = "stage/$name"
            New-Item -ItemType Directory -Force $stage | Out-Null
            foreach ($bin in $groups[$name]) { Copy-Item "target/release/$bin.exe" $stage/ }
            $zip = "$name-$version-windows-x64.zip"
            Compress-Archive -Path "$stage/*" -DestinationPath "dist/$zip"
            $hash = (Get-FileHash "dist/$zip" -Algorithm SHA256).Hash.ToLower()
            $sums += "$hash  $zip`n"
          }
          [IO.File]::WriteAllText("$PWD/dist/SHA256SUMS", $sums)
          Get-Content dist/SHA256SUMS

      - name: GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN || github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          $repo = if ('${{ inputs.repository }}') { '${{ inputs.repository }}' } else { '${{ github.repository }}' }
          # Заметки — из аннотации тега. Заголовки Markdown (`#`) git при создании тега вырезает
          # как комментарии, если не сказать `git tag -a --cleanup=verbatim …`.
          git fetch --force origin "refs/tags/${tag}:refs/tags/${tag}"
          $notes = (git tag -l --format='%(contents)' $tag) -join "`n"
          $flags = @('--repo', $repo, '--title', $tag)
          if ('${{ steps.version.outputs.prerelease }}' -eq 'true') { $flags += '--prerelease' }
          if ($notes.Trim()) {
            [IO.File]::WriteAllText("$PWD/notes.md", $notes)
            $flags += @('--notes-file', 'notes.md')
          } elseif ($repo -eq '${{ github.repository }}') {
            $flags += '--generate-notes'
          } else {
            $flags += @('--notes', "Выпуск $tag")
          }
          # Выпуск уже есть (перезапуск workflow) — только дозалить файлы.
          gh release view $tag --repo $repo *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag dist/* --repo $repo --clobber
          } else {
            gh release create $tag dist/* @flags
          }
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
